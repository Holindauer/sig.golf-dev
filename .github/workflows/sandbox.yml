name: Dedicated Linux verifier checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    # Never attach this credential-free, disposable worker to pull_request jobs.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, leansphincs-verifier]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash setup.sh
      - run: lake build LeanSphincs LeanSphincsTest
      - run: lake env lean scripts/check-ots-axioms.lean
      - run: python3 -m unittest discover -s tests -v
      - run: lake env lean scripts/check-availability-axioms.lean
      - run: python3 scripts/test-sandbox-lifecycle.py
      - run: python3 scripts/test-sandbox-comparator.py
      - run: python3 scripts/test-verifier.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-test-evidence
          path: |
            benchmark-results/**/*.log
            benchmark-results/**/result.json
          retention-days: 14
